<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>mygame web port — prototype</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#ddd;font:14px system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
 canvas{position:fixed;left:0;top:0;image-rendering:pixelated;touch-action:none;background:#000}
 .ui{position:fixed;display:flex;gap:6px;align-items:center;z-index:2}
 #top{left:calc(6px + env(safe-area-inset-left));top:calc(6px + env(safe-area-inset-top))}
 #btns{right:calc(10px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));flex-direction:column-reverse}
 button,select{font:inherit;color:#fff;background:rgba(20,20,30,.55);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:4px 10px;touch-action:none}
 #btns button{width:60px;height:60px;font-size:22px;border-radius:50%}
 .pedal{position:fixed;display:none;z-index:2;width:88px;height:88px;font-size:34px;border-radius:50%}
 body.driving .pedal{display:block} body.driving .foot{display:none}
 #gas{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(40,140,60,.6)}
 #brake{left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(170,40,40,.6)}
 body.driving #btns{bottom:calc(116px + env(safe-area-inset-bottom))}
 #top button{min-width:36px;height:34px}
 #info{position:fixed;left:6px;bottom:calc(22px + env(safe-area-inset-bottom));font:11px monospace;color:#9f9;z-index:2;pointer-events:none}
 a{color:#8cf}
</style></head><body>
<canvas id="c" width="240" height="320"></canvas>
<div id="top" class="ui">
 <select id="city"><option value="city1_h">Город 1</option><option value="city2_s">Город 2</option></select>
 <button id="zm" title="Отдалить">−</button><button id="zp" title="Приблизить">+</button><button id="fs" title="На весь экран">⛶</button><button id="bl" title="Кровь (B)">🩸</button><button id="snd" title="Звук (M)">🔊</button>
 <a href="viewer.html">спрайты</a>
</div>
<div id="btns" class="ui"><button data-k="fire" class="foot">🔫</button><button id="qbtn" class="foot">Q</button><button id="ebtn">E</button></div>
<button id="gas" class="pedal" data-k="up" title="Газ (справа)">⛽</button>
<button id="brake" class="pedal" data-k="down" title="Тормоз / назад (слева)">🛑</button>
<div id="info"></div>
<script type="module" src="js/game.js"></script>
</body></html>
